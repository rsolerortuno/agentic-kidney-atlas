# Deterministic thresholds and weights. Changing these changes results; every run records this file.
question: "What are the candidate therapeutic targets and biomarkers in ccRCC with the strongest convergent evidence?"
disease:
  name: clear cell renal cell carcinoma
  mondo: "MONDO:0005005"
  open_targets_id: "MONDO_0005005"   # Open Targets disease id ("clear cell renal carcinoma")
  open_targets_top: 2000             # associated targets pulled for convergence scoring

omics:
  padj: 0.05
  min_abs_log2fc:
    rna: 1.0
    protein: 0.5
    phospho: 0.5

literature:
  disease_query: "clear cell renal cell carcinoma"
  disease_pmids: 100          # top PubTator3 hits for the disease query (annotations only)
  top_genes: 50               # omics candidates searched individually
  pmids_per_gene: 5
  max_extraction_abstracts: 100
  extraction_batch_size: 25

convergence:
  # Convergence = agreement of INDEPENDENT evidence streams. Each stream is a component in [0, 1];
  # score = sum(stream_weight * component). Omics layers are combined into ONE stream so that
  # differential expression alone (thousands of genes) cannot dominate the ranking.
  omics_layer_weights:   # within-stream weights, normalized by their sum
    rna: 1.0           # significant & above fold-change threshold in RNA
    protein: 1.5       # significant & above threshold in protein (closer to function)
    phospho: 0.5       # significant phospho change (gene level)
    concordance: 0.5   # RNA and protein significant in the same direction
  # v2 (after evaluation v1, see evals/results.md): the Open Targets overall score was replaced by its
  # genetics datatypes, because the overall score also contains literature/expression evidence that the
  # other streams already measure (double counting); literature also takes Open Targets text-mining into
  # account to correct the selection bias of the local PubMed corpus (searched only for top omics genes).
  stream_weights:
    omics: 2.0         # CPTAC tumor-vs-normal expression evidence (above)
    cnv: 0.5           # max(loss, gain) frequency in CPTAC tumors
    literature: 1.0    # max(min(1, validated local relations / 3), Open Targets literature datatype)
    genetics: 2.0      # max(Open Targets genetic_association, somatic_mutation) for ccRCC
    tractability: 0.5  # 1 approved/clinical drug, 0.5 tractable modality only, 0 otherwise (enriched genes)
  top_n_report: 25
  top_n_eval: 100

cell_context:
  # Single-cell and spatial context for the report candidates (narrative targets + top-25 convergence of the
  # 2026-10-31 run). It annotates candidates; it does NOT change the convergence score (evaluated in M8).
  targets: [CA9, EPAS1, MET, KDR, EGFR, COXFA4L2, ENO2, PLIN2, CXCR4, CD74, PIGR, ACY1, FAS, GRAMD4, ERBB2,
            TNFRSF10B, ATP1A1, PTPRC, PDGFRA, FHIT, SCARB1, AGMAT, GPC3, IKZF1, DDC, TNFAIP3, CARD11, NDRG1, MT1G]
  scrna:
    tissues: {Tumour: tumor, Tumour-normal: interface, "Normal kidney": normal}
    exclude_disease: [kidney oncocytoma, kidney benign neoplasm]   # same study, not ccRCC
    min_cells_pseudobulk: 20      # donor x cell group pseudobulks below this are not used
    expressing_min_pct: 10        # a cell group "expresses" a gene if >= 10 % of its tumor cells have >= 1 UMI
  spatial:
    map_genes: [CA9, KDR, CD74, EPAS1, MET, PIGR, COL23A1, RAB42]   # genes drawn on the tissue maps in the report
    markers_per_group: 40         # deconvolution reference genes per cell group (targets are excluded)
    min_marker_cpm: 20
    high_quantile: 0.9            # target-high spots: top 10 % of a section (with >= 1 UMI)
    min_high_spots: 20
    permutations: 1000
    seed: 7

structure:
  # AlphaFold DB model + pocket detection (pyKVFinder) + molecular-glue-degrader (MGD) site scoring.
  min_plddt_keep: 50             # residues below are removed before cavity detection (disordered "spaghetti")
  confident_plddt: 70
  pocket_volume: [150, 1500]     # A^3 window typical of small-molecule / glue pockets
  lysine_radius: 20              # A from pocket centroid: surface lysines an E2~Ub could reach
  lysine_saturation: 8           # lysines at which the component reaches 1 (first version used 4: saturated in 80 % of pockets)
  lysine_min_rsa: 0.25           # relative solvent accessibility of the lysine side chain
  hairpin_radius: 15             # A: G-loop-like beta-hairpin degron near the pocket
  mgd_weights: {confidence: 0.3, geometry: 0.3, lysines: 0.25, degron: 0.15}
  top_pockets: 3
  # Known molecular-glue-degrader substrates, scored the same way as the candidates, to test the MGD score:
  # IKZF1/IKZF3 (lenalidomide, CRBN), GSPT1 (CC-885, eRF3a), CSNK1A1 (lenalidomide, CK1alpha), ZFP91 (CRBN), SALL4 (thalidomide)
  controls: [IKZF1, IKZF3, GSPT1, CSNK1A1, ZFP91, SALL4]

discovery:
  # Target discovery: concordant tumor-up genes (CPTAC RNA + protein) that are also attributable to a cell type in
  # scRNA-seq, scored for novelty (few ccRCC papers), absence of clinical drugs and druggability. Annotation only:
  # it does not change the convergence score.
  min_rna_log2fc: 1.0
  min_protein_log2fc: 0.5
  min_source_share: 0.4          # the dominant cell group must hold >= 40 % of the gene's tumour transcripts
  min_source_pct: 10             # ... and >= 10 % of its cells must express it
  novel_max_ccrcc_papers: 15     # "little bibliographic support": <= 15 Europe PMC records for gene AND ccRCC terms
  saturation_papers: 50          # understudied component reaches 0 at this many ccRCC papers
  safe_max_ntpm: 50              # vital-organ expression (HPA nTPM) above which a target carries off-tumor risk
  weights: {omics: 2.0, cell_specificity: 2.0, understudied: 1.5, undrugged: 1.0, druggable: 1.0, safety: 1.5, aggressiveness: 0.5}
  shortlist_per_track: {tumor: 12, stroma: 5, immune: 5}   # novel candidates that also get spatial and structure analysis
